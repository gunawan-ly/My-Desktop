name: SSH Linux via Tailscale

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '355'

run-name: 'SSH Linux (${{ github.run_id }})'

defaults:
  run:
    shell: bash

jobs:
  ssh:
    name: Tailscale + SSH
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          LINUX_USER_PASSWORD: 'Awan*123'
        run: |
          set -u
          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "::error::Secret TAILSCALE_AUTHKEY belum dikonfigurasi."
            exit 1
          fi
          if [ -z "${SSH_PUBLIC_KEY:-}" ] && [ -z "${LINUX_USER_PASSWORD:-}" ]; then
            echo "::error::Set secret SSH_PUBLIC_KEY (public key) atau LINUX_USER_PASSWORD (password) agar bisa login SSH."
            exit 1
          fi
          echo "Configuration valid."

      - name: Setup Tailscale + SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          LINUX_USER_PASSWORD: 'Awan*123'
          TS_HOSTNAME: linux-${{ github.run_id }}
        run: |
          bash scripts/ssh/tailscale_ssh_linux.sh

      - name: Keep Alive
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh
