name: Sesi Runner (V2)

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Nama host yang tampil di aplikasi CRD (default: Macbook).'
        required: false
        default: 'Macbook'
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '345'
      otp:
        description: 'Security code OTP dari HP (Settings > Google > Manage Google Account > Security & sign-in > Security code). Diperlukan saat job memakai perangkat/login baru; jika kosong memakai secret CRD_OTP.'
        required: false
        default: ''

run-name: 'CRD V2 (${{ github.run_id }})'

defaults:
  run:
    shell: bash

jobs:
  crd:
    name: Sesi Runner (V2)
    runs-on: macos-latest
    timeout-minutes: 360

    permissions:
      contents: read
      issues: write

    env:
      GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
      GOOGLE_PASS: ${{ secrets.GOOGLE_PASS }}
      CRD_PIN: ${{ secrets.CRD_PIN }}
      CRD_OTP: ${{ inputs.otp || secrets.CRD_OTP }}
      CRD_SUDO_PASS: ${{ secrets.CRD_SUDO_PASS }}
      CRD_LOCAL_PASS: ${{ secrets.CRD_LOCAL_PASS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        run: |
          set -u

          if [ -z "${GOOGLE_USER:-}" ]; then
            echo "::error::Secret GOOGLE_USER kosong. Set email akun Google pemilik CRD."
            exit 1
          fi
          case "$GOOGLE_USER" in
            *@*) ;;
            *)
              echo "::error::GOOGLE_USER harus berupa email."
              exit 1
              ;;
          esac

          if [ -z "${GOOGLE_PASS:-}" ]; then
            echo "::error::Secret GOOGLE_PASS belum dikonfigurasi."
            exit 1
          fi

          if [ -z "${CRD_PIN:-}" ]; then
            echo "::error::Secret CRD_PIN belum dikonfigurasi."
            exit 1
          fi
          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            echo "::error::CRD_PIN harus angka 6+ digit (contoh: 123456)."
            exit 1
          fi

          if [ -n "${CRD_OTP:-}" ]; then
            echo "OTP disuplai dari ${{ inputs.otp && 'input otp' || 'secret CRD_OTP' }}."
          else
            echo "::warning::CRD_OTP kosong. Jika job memakai perangkat/login baru, Google akan meminta"
            echo "::warning::security code di HP (Settings > Google > Manage Google Account > Security"
            echo "::warning::& sign-in > Security code) dan enrollment akan GAGAL cepat tanpa mengisinya."
          fi

          echo "Configuration valid."

      - name: Provision user pembantu admin (utk prompt installer GUI)
        if: env.CRD_HELPER_USER != '' && env.CRD_HELPER_PASS != ''
        env:
          CRD_HELPER_USER: ${{ secrets.CRD_HELPER_USER }}
          CRD_HELPER_PASS: ${{ secrets.CRD_HELPER_PASS }}
        run: |
          set -uo pipefail
          u="${CRD_HELPER_USER}"
          p="${CRD_HELPER_PASS}"
          if ! sudo -n true 2>/dev/null; then
            echo "::warning::NOPASSWD tidak aktif — tidak bisa buat user pembantu; lewati."
            exit 0
          fi
          if sudo -n dscl . -list /Users 2>/dev/null | grep -qx "$u"; then
            # User sudah ada: reset (mungkin gagal tanpa SecureToken -> non-fatal).
            if sudo -n sysadminctl -resetPasswordFor "$u" -newPassword "$p" 2>&1; then
              echo "Password user pembantu $u di-reset (dikenal)."
            else
              echo "::warning::reset password $u gagal — gunakan CRD_HELPER_USER baru jika perlu."
            fi
          else
            if sudo -n sysadminctl -addUser "$u" -fullName "CRD Helper Admin" \
                 -password "$p" -home "/Users/$u" -admin 2>&1; then
              echo "User pembantu $u DIBUAT (admin, password dikenal)."
            else
              echo "::warning::sysadminctl gagal buat user $u (non-fatal)."
            fi
          fi
          if sudo -n dscl . -authonly "$u" "$p" 2>/dev/null; then
            echo "AUTH OK: user=$u password=(ter-mask otomatis oleh GitHub)"
            printf 'user=%s\npassword=%s\n' "$u" "$p" > /tmp/crd-helper.creds
          else
            echo "::warning::verifikasi auth user $u GAGAL (non-fatal)."
          fi

      - name: Set password user job (agar sudo -S tersedia)
        if: env.CRD_LOCAL_PASS != ''
        env:
          CRD_LOCAL_PASS: ${{ secrets.CRD_LOCAL_PASS }}
        run: |
          if sudo -n true 2>/dev/null && [ -n "$CRD_LOCAL_PASS" ]; then
            if sudo -n dscl . -passwd /Users/"$(whoami)" "$CRD_LOCAL_PASS" 2>/dev/null; then
              echo "Password job user $(whoami) ditetapkan (dikenal)."
            else
              echo "::warning::dscl gagal set password (abaikan bila sudo NOPASSWD sudah aktif)."
              echo "::warning::Pastikan secret CRD_SUDO_PASS utk fallback run_sudo."
            fi
          else
            echo "::warning::Tanpa NOPASSWD, dscl tidak bisa set password."
            echo "::warning::Pastikan secret CRD_SUDO_PASS utk fallback run_sudo."
          fi

      - name: Setup CRD (V2)
        env:
          CRD_NAME: ${{ inputs.hostname }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
          CRD_OTP: ${{ inputs.otp || secrets.CRD_OTP }}
          CRD_CLEANUP: "0"
        run: |
          bash scripts/crd/setup_crd_v2.sh

      - name: Sambungkan Tailscale (biar Lyra bisa SSH masuk)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          # Pola manual yang terbukti di sesi 21 Nov 2026, diotomatiskan:
          # pasang CLI + daemon sistem, lalu gabung tailnet pakai auth key.
          # Key-nya secret repo TAILSCALE_AUTHKEY; nilainya TIDAK ditulis
          # di repo ini (repo publik). Sesudah langkah ini node muncul di
          # tailnet dengan nama host sesi, dan Lyra bisa masuk lewat SSH
          # untuk memeriksa sesi dari dalam.
          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "::warning::Secret TAILSCALE_AUTHKEY kosong; langkah Tailscale dilewati."
            exit 0
          fi
          echo "Install Tailscale CLI..."
          brew install tailscale 2>&1 | tail -2 || echo "::warning::brew install tailscale gagal"
          echo "Pasang daemon sistem Tailscale..."
          sudo -n tailscaled install-system-daemon 2>&1 | tail -2 \
            || echo "::warning::install-system-daemon gagal"
          echo "Sambungkan ke tailnet sebagai ${{ inputs.hostname }}..."
          if sudo -n tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="${{ inputs.hostname }}"; then
            echo "Tailscale tersambung: $(tailscale ip -4 2>/dev/null || echo '?')"
          else
            echo "::warning::tailscale up gagal; sesi tetap jalan tanpa tailnet"
          fi

      - name: Install aplikasi sesi (BetterDisplay + displayplacer + VS Code)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Install BetterDisplay (untuk pemakaian manual selama sesi)..."
          brew install --cask betterdisplay 2>&1 | tail -2 || echo "::warning::brew install betterdisplay gagal"
          echo "Install displayplacer (untuk set resolusi display)..."
          brew install displayplacer 2>&1 | tail -2 || echo "::warning::brew install displayplacer gagal"
          echo "Install Visual Studio Code..."
          brew install --cask visual-studio-code 2>&1 | tail -2 || echo "::warning::brew install visual-studio-code gagal"
          echo "Install selesai."

      - name: Install aplikasi chat (Telegram + WhatsApp + Discord)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Install Telegram Desktop..."
          brew install --cask telegram 2>&1 | tail -2 || echo "::warning::brew install telegram gagal"
          echo "Install WhatsApp Desktop..."
          brew install --cask whatsapp 2>&1 | tail -2 || echo "::warning::brew install whatsapp gagal"
          echo "Install Discord..."
          brew install --cask discord 2>&1 | tail -2 || echo "::warning::brew install discord gagal"
          echo "Install AudioRelay (mic HP dipakai dari dalam sesi)..."
          brew install --cask audiorelay 2>&1 | tail -2 || echo "::warning::brew install audiorelay gagal"
          echo "Install aplikasi chat selesai."

      - name: Terapkan settingan sesi (dark mode, aksesibilitas, region)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Set Dark Mode..."
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' 2>/dev/null \
            || echo "::warning::set dark mode gagal"
          echo "Set Reduce transparency/motion OFF (eksplisit)..."
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess reduceMotion -bool false
          echo "Set Region Asia/Indonesia (bahasa TIDAK diubah)..."
          defaults write NSGlobalDomain AppleLocale -string "id_ID"
          echo "Settingan diterapkan."

      - name: Set resolusi display 1600x900 (displayplacer)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          list_out="$(displayplacer list 2>/dev/null || true)"
          echo "$list_out" | head -25
          sid="$(echo "$list_out" | awk '/Persistent screen id:/{print $4; exit}')"
          if [ -z "$sid" ]; then
            echo "::warning::tidak dapat membaca screen id dari displayplacer; lewati."
            exit 0
          fi
          echo "Mencoba set 1600x900 pada $sid..."
          # Ambil hz & color_depth aktual dari daftar mode (jangan hardcode:
          # display virtual runner hanya menyediakan color_depth 7, bukan 8).
          mode_line="$(echo "$list_out" | grep -o 'res:1600x900 hz:[0-9]* color_depth:[0-9]*' | head -1 || true)"
          if [ -z "$mode_line" ]; then
            echo "::warning::mode 1600x900 tidak ada di daftar displayplacer; lewati."
            exit 0
          fi
          hz="$(echo "$mode_line" | grep -o 'hz:[0-9]*' | cut -d: -f2)"
          cdp="$(echo "$mode_line" | grep -o 'color_depth:[0-9]*' | cut -d: -f2)"
          echo "Mode terdeteksi: res:1600x900 hz:$hz color_depth:$cdp"
          if displayplacer "id:$sid res:1600x900 hz:$hz color_depth:$cdp enabled:true scaling:off origin:(0,0) degree:0" 2>&1 | tail -5; then
            echo "Resolusi 1600x900 diterapkan."
          else
            echo "::warning::displayplacer gagal set 1600x900."
          fi

      - name: Samakan terminal dengan Linux (zsh + tema)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          # Terminal sesi disamakan dengan mesin Linux Awan (setup 21 Nov 2026):
          # zsh + perintah `tema` (8 tema Starship/powerlevel10k), syntax
          # highlighting, autosuggestions, fzf, eza, fastfetch. Kit-nya disimpan
          # di scripts/terminal/ (disalin dari mesin InstaBox utama, alamat
          # plugin disesuaikan ke Homebrew).
          echo "Install perangkat terminal..."
          brew install starship powerlevel10k zsh-autosuggestions \
            zsh-syntax-highlighting fzf eza fastfetch 2>&1 | tail -2 \
            || echo "::warning::sebagian perangkat terminal gagal terpasang"
          brew install --cask font-fira-code-nerd-font 2>&1 | tail -2 \
            || echo "::warning::font Fira Code Nerd Font gagal terpasang"
          echo "Pasang konfigurasi terminal..."
          KIT="scripts/terminal"
          cp "$KIT/zshrc" ~/.zshrc
          mkdir -p ~/.config/starship-themes ~/.config/p10k-themes
          cp "$KIT"/starship-themes/*.toml ~/.config/starship-themes/
          cp "$KIT"/p10k-themes/*.zsh ~/.config/p10k-themes/
          echo starship-pastel-powerline > ~/.prompt-theme
          echo "Set font Terminal ke Fira Code Nerd Font (best effort)..."
          osascript -e 'tell application "Terminal" to set font name of default settings to "FiraCode Nerd Font"' 2>/dev/null \
            || echo "::warning::set font Terminal gagal; atur manual bila ikon prompt tampil kotak"
          echo "Terminal selesai: tema aktif powerline, ganti dengan perintah tema."

      - name: Bersihkan indeks Spotlight (kecualikan node_modules + bangun ulang)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          # Spotlight di sesi fresh kebanjiran indeks node_modules (puluhan ribu
          # file kecil bawaan image + hasil instalasi awal), sampai hasil
          # aplikasi tenggelam/hilang dari pencarian (kejadian 22 Nov 2026:
          # cari BetterDisplay malah muncul folder node_modules). Tandai semua
          # node_modules yang sudah ada sebagai jangan-diindeks, lalu bangun
          # ulang indeks dari nol sebagai langkah terakhir setup, supaya
          # Spotlight langsung normal saat sesi dipakai.
          echo "Menandai node_modules sebagai .metadata_never_index..."
          for root in "$HOME" /usr/local/lib /opt/homebrew/lib; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 8 -type d -name node_modules -prune \
              -exec touch {}/.metadata_never_index \; 2>/dev/null || true
          done
          echo "Membangun ulang indeks Spotlight (mdutil -E /)..."
          sudo -n mdutil -i on / 2>/dev/null || true
          if sudo -n mdutil -E / 2>/dev/null; then
            echo "Indeks Spotlight dibangun ulang; Spotlight bersih dalam beberapa menit."
          else
            echo "::warning::mdutil -E gagal; Spotlight mungkin perlu dibangun ulang manual."
          fi

      - name: Upload Debug Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crd-debug-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/crd-*.png
            /tmp/crd-*.log
            !/tmp/crd.enroll.err.log
            /tmp/crd.code
            /tmp/crd.dmg
            /tmp/crd.start.log

      - name: Keep Alive
        if: ${{ success() }}
        env:
          CRD_NAME: ${{ inputs.hostname }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh